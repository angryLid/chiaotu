mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info

dns:
  enable: true
  listen: "0.0.0.0:1053"
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16

  # 用于解析其他加密 DNS 域名的基础 DNS，必须是纯 IP
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114

  # 负责国内域名的解析（尽量用国内低延迟的 DNS）
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - https://dns.alicdn.com/dns-query
    - https://doh.pub/dns-query

  # 负责国外/被墙域名的解析（建议全部用加密 DNS 防污染）
  fallback:
    - https://1.1.1.1/dns-query
    - https://dns.google/dns-query
    - tls://8.8.4.4

  # 只有当 nameserver 返回的 IP 不在 GeoIP CN 且不在 ipcidr 范围内时，才采用 fallback 的结果
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 127.0.0.1/8
      - 0.0.0.0/32

fake-ip-filter:
  # 局域网与本地地址
  - "*.lan"
  - "*.local"
  - "*.home.arpa"
  - "localhost"
  - "router.asus.com"
  - "miwifi.com"

  # 微信及腾讯核心服务
  - "+..weixin.qq.com"
  - "+..qq.com"
  - "+..tencent.com"
  - "+..qlogo.cn"
  - "+..qpic.cn"

  # 阿里与高德
  - "+..alipay.com"
  - "+..taobao.com"
  - "+..amap.com"
  - "+..alicdn.com"

  # 系统与联网检测
  - "*.msftconnecttest.com"
  - "*.msftncsi.com"
  - "*.apple.com"
  - "*.icloud.com"

  # 主流游戏平台
  - "+..xboxlive.com"
  - "+..sony.com"
  - "+..playstation.net"
  - "*.nintendo.net"
  - "+..steamcommunity.com"

  # NTP 时间同步
  - "time.*.com"
  - "time.*.apple.com"
  - "time.nstl.gov.cn"
  - "*.ntp.org.cn"

proxies: []
proxy-groups: []
rules:
  - RULE-SET,ai_non_ip,🤖 AI
  - RULE-SET,Gemini,🤖 AI

  - RULE-SET,apple_cdn,🍎 Apple
  - RULE-SET,apple_services,🍎 Apple
  - RULE-SET,apple_cn_non_ip,DIRECT

  - RULE-SET,microsoft_cdn_non_ip,🟦 Microsoft
  - RULE-SET,microsoft_non_ip,🟦 Microsoft

  - RULE-SET,lan_ip,DIRECT
  - RULE-SET,lan_non_ip,DIRECT
  - RULE-SET,direct_non_ip,DIRECT
  - RULE-SET,domestic_non_ip,DIRECT
  - RULE-SET,domestic_ip,DIRECT
  - "DOMAIN-SUFFIX,cn,DIRECT"
  - "DOMAIN-KEYWORD,-cn,DIRECT"
  - "GEOIP,CN,DIRECT"

  - RULE-SET,global_non_ip,🌐 手动选择
  - "MATCH,🌐 手动选择"

