mixed-port: 7890
allow-lan: true
bind-address: "*"
mode: rule
log-level: info

dns:
  enable: true
  listen: "0.0.0.0:1053"

  default-nameserver:
    - "tls://223.5.5.5:853" # aliyun
    - "223.6.6.6" # aliyun
    - "https://120.53.53.53/dns-query" # tencent
    - "119.29.29.29" # tencent

  nameserver:
    - system

  fallback:
    - "8.8.4.4"
    - "https://1.1.1.1/dns-query"
    - "168.95.192.1"

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fallback-filter:
    {
      geoip: true,
      geoip-code: CN,
      ipcidr: [240.0.0.0/4, 127.0.0.1/8, 0.0.0.0/32],
    }

fake-ip-filter:
  # 局域网与本地地址
  - "*.lan"
  - "*.local"
  - "*.home.arpa"
  - "localhost"
  - "router.asus.com"
  - "miwifi.com"

  # 微信及腾讯核心服务
  - "+..weixin.qq.com"
  - "+..qq.com"
  - "+..tencent.com"
  - "+..qlogo.cn"
  - "+..qpic.cn"

  # 阿里与高德
  - "+..alipay.com"
  - "+..taobao.com"
  - "+..amap.com"
  - "+..alicdn.com"

  # 系统与联网检测
  - "*.msftconnecttest.com"
  - "*.msftncsi.com"
  - "*.apple.com"
  - "*.icloud.com"

  # 主流游戏平台
  - "+..xboxlive.com"
  - "+..sony.com"
  - "+..playstation.net"
  - "*.nintendo.net"
  - "+..steamcommunity.com"

  # NTP 时间同步
  - "time.*.com"
  - "time.*.apple.com"
  - "time.nstl.gov.cn"
  - "*.ntp.org.cn"

proxies: []
proxy-groups: []
rules:
  - RULE-SET,ai_non_ip,🤖 AI
  - RULE-SET,Gemini,🤖 AI

  - RULE-SET,apple_cdn,🍎 Apple
  - RULE-SET,apple_services,🍎 Apple
  - RULE-SET,apple_cn_non_ip,DIRECT

  - RULE-SET,microsoft_cdn_non_ip,🟦 Microsoft
  - RULE-SET,microsoft_non_ip,🟦 Microsoft

  - RULE-SET,lan_ip,DIRECT
  - RULE-SET,lan_non_ip,DIRECT
  - RULE-SET,direct_non_ip,DIRECT
  - RULE-SET,domestic_non_ip,DIRECT
  - RULE-SET,domestic_ip,DIRECT
  - "DOMAIN-SUFFIX,cn,DIRECT"
  - "DOMAIN-KEYWORD,-cn,DIRECT"
  - "GEOIP,CN,DIRECT"

  - RULE-SET,global_non_ip,🌐 手动选择
  - "MATCH,🌐 手动选择"

rule-providers:
  ai_non_ip:
    type: http
    behavior: classical
    format: text
    interval: 43200
    url: https://ruleset.skk.moe/Clash/non_ip/ai.txt
    path: ./sukkaw_ruleset/ai_non_ip.txt

  Gemini:
    type: http
    behavior: classical
    format: text
    interval: 43200
