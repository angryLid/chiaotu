openapi: 3.0.3
info:
  title: friend-cats API
  description: |
    The REST API of friend-cats. It currently provides the following kinds of resources:

    - subscription: a subscription is a text config file of a few tens of KB; the raw
      content is stored directly in SQLite and is not parsed in any way for now. Node
      parsing happens in the browser (chiaotu SPA); the backend never parses YAML.
    - rule: a node-filtering rule. The backend only stores and validates rules (CRUD) —
      it never evaluates them; evaluation happens in the frontend against the
      subscription content parsed in the browser. The filter spec is stored as a JSON
      object as-is (its shape is guaranteed by the frontend zod); the backend guards
      against junk: name is required and unique, subIds / nameKeywords / typeMatch
      must be arrays of non-empty strings, and referenced subscription ids must exist.
      Deletes are soft (deleted_at tombstone; excluded from all reads).
    - generated: a generated result file (a full clash YAML config). The frontend
      computes it in the browser — apply a rule to the parsed nodes, run the produce
      pipeline, dump YAML — and uploads it; the backend only stores and serves the
      most recent result. `GET /api/generated` returns the latest one (by generation
      time), `POST /api/generated` stores a new one. Rows carry a soft-delete
      tombstone (deleted_at), though no delete endpoint exists yet.
    - rule set: a named collection of routing matchers (DOMAIN / DOMAIN-SUFFIX /
      DOMAIN-KEYWORD / DOMAIN-WILDCARD / IP-CIDR) distributed as a standalone
      mihomo `classical` rule-provider payload. Every rule set is addressed by its
      `slug`, and `GET /api/rulesets/payload/{slug}` serves it as `text/plain`
      **without authentication** — the slug is the capability itself, exactly like
      `GET /api/generated/{name}`. Generated configs reference that URL from
      `rule-providers`, so editing a rule set propagates to every client on its own
      refresh interval (live reference, not a snapshot).
    - hosts profile: a named collection of domain → IP mappings injected into the
      generated config's `hosts` block during browser-side generation.

    In addition, `GET /api/initial-dump` returns the complete application state (all
    active subscriptions with content + all rules) in one call, so the frontend can
    hydrate its store on entry with a single request.

    ## Unified response envelope

    As long as the server is running normally, every request returns HTTP 200;
    business state is expressed through the response body envelope:

    ```json
    { "status": "Ok", "result": <business data> }
    { "status": "Err:<CODE>", "result": "<error description>", "stack"?: "<server stack>" }

    Error envelopes may carry an optional `stack` field: a diagnostic copy of the
    server-side call stack (including the underlying network/Abort error when one
    triggered the failure). It exists to aid debugging `FETCH_FAILED` and other
    server errors from the browser DevTools; it is never present on `Ok`.
    ```

    - The client receives no HTTP response at all = gateway/server failure (transport-level error)
    - Receiving HTTP 200 = the server is up; judge business success via `status`

    `status` values (the CODE in `Err:<CODE>` is in the table below):

    | status                 | meaning                                       |
    | ---------------------- | --------------------------------------------- |
    | `Ok`                   | business success; `result` is the business data |
    | `Err:INVALID_ARGUMENT` | parameter validation failed                   |
    | `Err:NOT_FOUND`        | resource not found (or endpoint not found)    |
    | `Err:FETCH_FAILED`     | url fetch failed (network error / upstream non-200 / over limit, etc.) |
    | `Err:LIMIT_EXCEEDED`   | a resource limit was exceeded (e.g. more than 10 subscriptions) |
    | `Err:METHOD_NOT_ALLOWED` | method not allowed                          |
    | `Err:UNAUTHORIZED`     | missing or invalid bearer token (authentication failed)         |
    | `Err:INTERNAL`         | internal server error                         |

    ## Authentication

    Every endpoint (including `GET /healthz`) requires HTTP Bearer
    authentication: `Authorization: Bearer <credential>`. The credential is the
    UTF-8 Base64 encoding of the shared secret: the server reads the raw secret
    from the `API_TOKEN` environment variable (required; the server fails closed
    and refuses requests without it) and Base64-encodes it once at startup, and
    the SPA stores and sends the same Base64-encoded form. Using Base64 keeps
    the header ASCII-safe and lets the shared secret contain non-ASCII
    characters. A missing or wrong credential is reported as the unified
    envelope `Err:UNAUTHORIZED` (HTTP stays 200).

    **Exceptions**: `GET /api/generated/{name}` and
    `GET /api/rulesets/payload/{slug}` are unauthenticated — the name / slug in the path is the access capability
    itself (the link is the secret; see those endpoints). Every other method on
    those same paths requires the bearer token as usual.

    ## Cross-origin access (CORS)

    The friend-cats server emits no CORS headers by default. To allow the chiaotu
    SPA to talk to it from a different origin, set `CORS_ALLOW_ORIGIN` to the
    exact origin (scheme + host + port, e.g. `http://localhost:5173`). When set:
    `Access-Control-Allow-Origin` is that value, methods are `*`, and headers are
    `Authorization, Content-Type`. Preflight `OPTIONS` requests are answered by
    the CORS layer without authentication.
  version: 0.1.0

security:
  - bearerAuth: []

servers:
  - url: http://localhost:8080
    description: Local development

tags:
  - name: subscription
    description: Subscription resource management
  - name: rules
    description: Node-filtering rule management (CRUD only; the backend stores and validates, the frontend evaluates)
  - name: generated
    description: Generated result files (the frontend produces them in the browser and uploads them; the backend stores and serves the latest one)
  - name: hosts
    description: Hosts profiles and entries used during browser-side projection generation
  - name: rulesets
    description: Rule sets distributed as standalone mihomo classical rule-provider payloads

paths:
  /healthz:
    get:
      summary: Health check
      operationId: healthz
      responses:
        "200":
          description: Server is healthy (envelope-wrapped, result is "ok")
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { type: string, enum: ["ok"] }
              example:
                status: "Ok"
                result: "ok"

  /api/initial-dump:
    get:
      summary: Get the complete application state (subscriptions with content + rules + hosts + rule sets)
      description: |
        The single entry-point call of the chiaotu SPA: returns all active
        subscriptions (full content), all rules (newest first), all Hosts
        profiles and all rule sets in one response, so the frontend can hydrate
        its global store with one round trip. Node parsing stays in the browser —
        the backend never parses YAML.
      operationId: initialDump
      tags: [subscription]
      responses:
        "200":
          description: Envelope-wrapped; result is the initial dump
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/InitialDump" }
              example:
                status: "Ok"
                result:
                  subscriptions:
                    - id: 1
                      name: basic.yaml
                      url: https://example.com/basic.yaml
                      content: "proxies:\n  - name: node-a\n    type: ss\n"
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
                  rules:
                    - id: 1
                      name: my-rule
                      filter:
                        nameKeywords: ["香港", "US"]
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
                  hostsProfiles: []
                  ruleSets:
                    - id: 1
                      name: work
                      slug: V1StGXR8Z5
                      key: chiaotu_rs_1
                      policy: GROUP
                      items:
                        - id: 1
                          rule_set_id: 1
                          type: DOMAIN-SUFFIX
                          payload: example.com
                          enabled: true
                          created_at: "2026-01-01T00:00:00Z"
                          updated_at: "2026-01-01T00:00:00Z"
                      created_at: "2026-01-01T00:00:00Z"
                      updated_at: "2026-01-01T00:00:00Z"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/hosts/profiles:
    get:
      summary: List active Hosts profiles
      operationId: listHostsProfiles
      tags: [hosts]
      responses:
        "200":
          description: Active profiles with active entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result:
                        type: array
                        items: { $ref: "#/components/schemas/HostsProfile" }
    post:
      summary: Create a Hosts profile
      operationId: createHostsProfile
      tags: [hosts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostsProfileInput" }
      responses:
        "200":
          description: Created profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Envelope" }

  /api/hosts/profiles/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      summary: Get a Hosts profile
      operationId: getHostsProfile
      tags: [hosts]
      responses:
        "200": { description: Profile, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
    put:
      summary: Rename a Hosts profile
      operationId: updateHostsProfile
      tags: [hosts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostsProfileInput" }
      responses:
        "200": { description: Updated profile, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
    delete:
      summary: Soft-delete a Hosts profile and all its entries
      operationId: deleteHostsProfile
      tags: [hosts]
      responses:
        "200": { description: Deleted profile, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }

  /api/hosts/profiles/{id}/entries/import:
    post:
      summary: Import up to 50 normalized Hosts entries
      operationId: importHostsEntries
      tags: [hosts]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostsImportInput" }
      responses:
        "200": { description: Active entries after import, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }

  /api/hosts/profiles/{id}/entries/{entryId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
      - name: entryId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      summary: Update a Hosts entry or its enabled state
      operationId: updateHostsEntry
      tags: [hosts]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/HostsEntryInput" }
      responses:
        "200": { description: Updated entry, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }
    delete:
      summary: Soft-delete a Hosts entry
      operationId: deleteHostsEntry
      tags: [hosts]
      responses:
        "200": { description: Deleted entry, content: { application/json: { schema: { $ref: "#/components/schemas/Envelope" } } } }

  /api/rulesets:
    get:
      summary: List active rule sets (with their items)
      description: |
        Returns all active (non-soft-deleted) rule sets, newest first, each with
        its active items. Soft-deleted rule sets and items are excluded.
      operationId: listRuleSets
      tags: [rulesets]
      responses:
        "200":
          description: Success; result is an array of rule sets (newest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result:
                        type: array
                        items: { $ref: "#/components/schemas/RuleSet" }
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create a rule set
      description: |
        name is required (non-empty, unique among active rule sets, at most 100
        characters, no comma or control character — with the `GROUP` policy the
        name becomes a proxy-group name inside a comma-separated rule line).
        policy is optional and defaults to `GROUP`.
        The backend assigns the `slug` (16 random lowercase alphanumerics from
        the Web Crypto API) — it is the public capability
        for `GET /api/rulesets/payload/{slug}` and is never supplied by the client.
        Fails with Err:LIMIT_EXCEEDED once 20 active rule sets exist.
      operationId: createRuleSet
      tags: [rulesets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleSetInput" }
      responses:
        "200":
          description: Success; result is the created rule set (with an empty items array)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/RuleSet" }
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "409":
          $ref: "#/components/responses/LimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/rulesets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Rule set ID
        schema: { type: integer, format: int64, minimum: 1 }
    get:
      summary: Get a single rule set (with its active items)
      operationId: getRuleSet
      tags: [rulesets]
      responses:
        "200":
          description: Success; result is the rule set
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/RuleSet" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Update a rule set's name / policy
      description: |
        Replaces name and policy with the values of this request (same validation
        as creation). The slug is immutable — rotate it via
        POST /api/rulesets/{id}/rotate-slug instead. Items are managed through
        the items endpoints and are unaffected.
      operationId: updateRuleSet
      tags: [rulesets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleSetInput" }
      responses:
        "200":
          description: Success; result is the updated rule set
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/RuleSet" }
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Soft-delete a rule set and all its items
      description: |
        Soft delete: the rule set and every item under it are marked deleted
        (deleted_at set) atomically via the soft_delete_rule_set RPC and are
        excluded from all reads. Afterwards GET /api/rulesets/payload/{slug} answers
        Err:NOT_FOUND.

        Caveat: mihomo keeps serving its last successfully downloaded copy of a
        rule-provider when a refresh fails, so deleting a rule set does not
        revoke it from clients that already cached the payload.
      operationId: deleteRuleSet
      tags: [rulesets]
      responses:
        "200":
          description: Success; result is null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { type: "null" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/rulesets/{id}/rotate-slug:
    post:
      summary: Rotate a rule set's public slug
      description: |
        Issues a fresh slug, invalidating the previous distribution link. Any
        generated config still referencing the old URL will fail to refresh its
        rule-provider (and mihomo will fall back to its cached copy), so the
        config must be regenerated.
      operationId: rotateRuleSetSlug
      tags: [rulesets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: Success; result is the rule set carrying its new slug
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/RuleSet" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/rulesets/{id}/items/import:
    post:
      summary: Import up to 50 normalized rule-set items
      description: |
        Mirrors the Hosts entry import: the frontend parses the pasted text (at
        most the first 50 physical lines) and posts normalized {type, payload}
        pairs. Items already present in the set are revived / left in place
        rather than duplicated; the response is the set's full active item list.
      operationId: importRuleSetItems
      tags: [rulesets]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64, minimum: 1 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleSetImportInput" }
      responses:
        "200":
          description: Success; result is the active items after the import
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result:
                        type: array
                        items: { $ref: "#/components/schemas/RuleSetItem" }
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/LimitExceeded"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/rulesets/{id}/items/{itemId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
      - name: itemId
        in: path
        required: true
        schema: { type: integer, format: int64, minimum: 1 }
    put:
      summary: Update a rule-set item's enabled state
      description: |
        Only `enabled` is mutable: type / payload are immutable because they are
        the item's identity (a partial unique index covers them). To change a
        matcher, delete the item and import the new one.
      operationId: updateRuleSetItem
      tags: [rulesets]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RuleSetItemInput" }
      responses:
        "200":
          description: Success; result is the updated item
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/RuleSetItem" }
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      summary: Soft-delete a rule-set item
      operationId: deleteRuleSetItem
      tags: [rulesets]
      responses:
        "200":
          description: Success; result is null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { type: "null" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/rulesets/payload/{slug}:
    get:
      summary: Download a rule set as a mihomo classical rule-provider payload
      description: |
        **This endpoint is intentionally UNAUTHENTICATED.** The slug (a
        backend-generated random string) is the capability itself — the link is the
        secret — so it can be pasted straight into a `rule-providers` entry with
        no token machinery, exactly like `GET /api/generated/{name}`. It lives
        under its own `payload/` path segment so it can never be confused with
        the authenticated `/api/rulesets/{id}` item route.

        The response body is the raw payload (envelope exception — this is a
        file download, one matcher per line, `TYPE,PAYLOAD`), served as
        `text/plain; charset=utf-8` with `X-Content-Type-Options: nosniff`
        because the body is user-controlled text hosted on the app's own origin.
        Disabled items are omitted. An `ETag` (weak hash of the payload) plus
        `Cache-Control: public, max-age=300` keep client refresh polling cheap;
        a matching `If-None-Match` is answered with 304 and no body.

        Consume it from a generated config as:

        ```yaml
        rule-providers:
          <key>:
            type: http
            behavior: classical
            format: text
            interval: 43200
            url: https://<origin>/api/rulesets/payload/<slug>
        ```

        Not-found keeps the JSON envelope (Err:NOT_FOUND).
      operationId: downloadRuleSet
      tags: [rulesets]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          description: The rule set's public slug (the capability)
          schema: { type: string }
        - name: If-None-Match
          in: header
          required: false
          description: When it matches the current ETag the server answers 304 with no body
          schema: { type: string }
      responses:
        "200":
          description: The raw classical rule-provider payload (one `TYPE,PAYLOAD` per line)
          headers:
            ETag:
              description: Weak hash of the payload
              schema: { type: string }
            Cache-Control:
              schema: { type: string, example: "public, max-age=300" }
            X-Content-Type-Options:
              schema: { type: string, enum: ["nosniff"] }
          content:
            text/plain:
              schema: { type: string }
              example: |
                DOMAIN-SUFFIX,example.com
                DOMAIN-KEYWORD,tracker
                IP-CIDR,10.0.0.0/8
        "304":
          description: Not modified (If-None-Match matched the current ETag)
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/subscriptions:
    get:
      summary: List all subscriptions
      description: |
        Returns the subscription list (summaries, without content, to keep response
        bodies small). To fetch full subscriptions (with content), use
        GET /api/initial-dump — the single entry-point call the frontend uses to
        hydrate its store.
      operationId: listSubscriptions
      tags: [subscription]
      responses:
        "200":
          description: Success; result is an array of subscription summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result:
                        type: array
                        items:
                          $ref: "#/components/schemas/SubscriptionSummary"
              example:
                status: "Ok"
                result: []
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create a subscription
      description: |
        The request body must satisfy: at least one of url and content is provided
        (non-empty).
        - url provided: the backend makes a network request, fetches the URL content and
          stores it (url wins over content)
        - only content provided: the content is stored directly

        The total number of subscriptions is capped at 10 (`Err:LIMIT_EXCEEDED` when the
        limit is already reached; the check runs before any url fetch).
      operationId: createSubscription
      tags: [subscription]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "200":
          description: Success; result is the full subscription (with content)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/Subscription" }
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "409":
          $ref: "#/components/responses/LimitExceeded"
        "502":
          $ref: "#/components/responses/FetchFailed"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/subscriptions/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Subscription ID
        schema:
          type: integer
          format: int64
          minimum: 1

    get:
      summary: Get a single subscription
      description: Returns the full subscription, including the raw content.
      operationId: getSubscription
      tags: [subscription]
      responses:
        "200":
          description: Success; result is the full subscription (with content)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/Subscription" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Update a subscription (full replacement)
      description: |
        The request body rules are the same as for creation (at least one of url and
        content, url wins).
        name / url / content are replaced entirely with the new values of this request.
      operationId: updateSubscription
      tags: [subscription]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubscriptionInput"
      responses:
        "200":
          description: Success; result is the updated full subscription
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/Subscription" }
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/NotFound"
        "502":
          $ref: "#/components/responses/FetchFailed"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Delete a subscription
      description: |
        Soft delete: the subscription is marked as deleted and is excluded from
        every subsequent read (list / get / full / count / initial-dump), but the
        underlying row is retained (no restore endpoint). Deleting an already-deleted
        or unknown id returns `Err:NOT_FOUND`.
      operationId: deleteSubscription
      tags: [subscription]
      responses:
        "200":
          description: Success; result is null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { type: "null" }
              example:
                status: "Ok"
                result: null
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/rules:
    get:
      summary: List all rules
      description: |
        Returns all active (non-soft-deleted) node-filtering rules, newest first.
        Unlike subscriptions, there is no summary shape: each entry is a full
        rule (with its filter). Soft-deleted rules are excluded.
      operationId: listRules
      tags: [rules]
      responses:
        "200":
          description: Success; result is an array of rules (newest first)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result:
                        type: array
                        items: { $ref: "#/components/schemas/Rule" }
              example:
                status: "Ok"
                result: []
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Create a rule
      description: |
        name is required (non-empty, unique). filter is optional and defaults to
        {} (a rule with no dimensions matches every node). The backend validates
        the filter's shape and that referenced subscription ids exist; it never
        evaluates the rule.
      operationId: createRule
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: Success; result is the created rule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/Rule" }
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/rules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Rule ID
        schema:
          type: integer
          format: int64
          minimum: 1

    get:
      summary: Get a single rule
      description: |
        Returns a single rule. Soft-deleted rules are excluded (returns 404).
      operationId: getRule
      tags: [rules]
      responses:
        "200":
          description: Success; result is the rule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/Rule" }
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    put:
      summary: Update a rule (full replacement)
      description: |
        name / filter are replaced entirely with the new values of this request
        (same validation as creation).
      operationId: updateRule
      tags: [rules]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleInput"
      responses:
        "200":
          description: Success; result is the updated rule
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/Rule" }
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    delete:
      summary: Delete a rule
      description: |
        Soft delete: the rule is marked as deleted (deleted_at set) and excluded
        from all reads. The underlying row is retained (no restore endpoint).
        Deleting an already-deleted or absent rule returns 404.
      operationId: deleteRule
      tags: [rules]
      responses:
        "200":
          description: Success; result is null
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { type: "null" }
              example:
                status: "Ok"
                result: null
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/generated:
    get:
      summary: Get the most recently generated result
      description: |
        Returns the generated result with the most recent creation time (soft-deleted
        rows excluded). Backward-compatible single-result helper used by the
        run-status panel's download-link shortcut. When nothing has been generated
        yet, returns `Err:NOT_FOUND`.
      operationId: latestGenerated
      tags: [generated]
      responses:
        "200":
          description: Success; result is the latest generated result (with content)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/Generated" }
              example:
                status: "Ok"
                result:
                  id: 3
                  name: aB3xYz9QpK
                  content: "mixed-port: 7890\nproxies:\n  - name: hk-01\n    type: vmess\n"
                  created_at: "2026-08-15T00:00:00Z"
                  updated_at: "2026-08-15T00:00:00Z"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

    post:
      summary: Store a new generated result
      description: |
        The frontend computes the result content in the browser (apply a rule to the
        parsed nodes, run the produce pipeline, dump clash YAML) and uploads it. The
        backend only validates that name and content are non-empty and persists the
        row. `name` is the nanoid chosen by the frontend; `content` is the produced
        config, stored as-is.
      operationId: createGenerated
      tags: [generated]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratedInput"
      responses:
        "200":
          description: Success; result is the created generated result (with content)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/Generated" }
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/generated/recent:
    get:
      summary: List generated results by page
      description: |
        Returns a page of generated results, ordered by updated_at descending
        (soft-deleted rows excluded). Each page holds up to 10 items. Used by
        the run-status panel to show a paged history of generated configs. When
        nothing has been generated yet, returns an empty page.
      operationId: recentGenerated
      tags: [generated]
      parameters:
        - name: page
          in: query
          required: false
          description: 1-based page number (default 1, clamped to at least 1)
          schema:
            type: integer
            default: 1
            minimum: 1
      responses:
        "200":
          description: Success; result is a page of generated results (newest modified first, with content)
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/GeneratedPage" }
              example:
                status: "Ok"
                result:
                  items:
                    - id: 5
                      name: xZ9qKpA3bY
                      content: "mixed-port: 7890\nproxies:\n  - name: hk-01\n    type: vmess\n"
                      created_at: "2026-08-16T00:00:00Z"
                      updated_at: "2026-08-16T00:00:00Z"
                  page: 1
                  page_size: 10
                  total: 1
                  total_pages: 1
        "500":
          $ref: "#/components/responses/InternalError"

  /api/generated/{name}:
    put:
      summary: Update an active generated result
      description: |
        Updates the generated content and/or optional display name. The public
        download token (`name`) does not change. An empty display name clears it.
      operationId: updateGenerated
      security:
        - bearerAuth: []
      tags: [generated]
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeneratedUpdate"
      responses:
        "200":
          description: Success; result is the updated generated result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      status: { type: string, enum: ["Ok"] }
                      result: { $ref: "#/components/schemas/Generated" }
        "400":
          $ref: "#/components/responses/InvalidArgument"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      summary: Fetch a generated result by name (unauthenticated download link)
      description: |
        Returns the generated result whose `name` matches the path segment, as
        raw YAML (`Content-Type: text/yaml`). When the request User-Agent
        contains "clash" (case-insensitive — i.e. a clash-family client), the
        response also carries `Content-Disposition: attachment; filename="<name>.yaml"`
        so the client can save the config with its proper filename; other
        clients get the YAML inline without a filename.

        **This is the only unauthenticated endpoint** — the name (a
        frontend-chosen nanoid) is the capability itself, so the link can be
        pasted into a browser or a clash client as a subscription URL without
        any token machinery. Keep names unguessable.

        **Envelope exception**: on success the response body is the file content
        itself (not the JSON envelope); not-found / errors keep the envelope
        (`Err:NOT_FOUND`).
      operationId: getGeneratedByName
      tags: [generated]
      parameters:
        - name: name
          in: path
          required: true
          description: The generated result name (nanoid), which acts as the access capability
          schema:
            type: string
      responses:
        "200":
          description: Success; the response body is the raw clash YAML config (file download)
          content:
            text/yaml:
              schema:
                type: string
              example: |
                mixed-port: 7890
                proxies:
                  - name: hk-01
                    type: vmess
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: >
        The bearer credential is the UTF-8 Base64 encoding of the shared
        secret from the server's API_TOKEN environment variable. Kept
        header-safe (ASCII) and supports non-ASCII secrets.
  schemas:
    Envelope:
      description: Unified response envelope
      type: object
      required: [status, result]
      properties:
        status:
          type: string
          description: '"Ok" or "Err:<CODE>"; the CODE values are in the table in info.description'
          enum:
            - "Ok"
            - "Err:INVALID_ARGUMENT"
            - "Err:NOT_FOUND"
            - "Err:FETCH_FAILED"
            - "Err:LIMIT_EXCEEDED"
            - "Err:METHOD_NOT_ALLOWED"
            - "Err:UNAUTHORIZED"
            - "Err:INTERNAL"
        result:
          nullable: true
          description: Business payload. Business data on success, an error description string on failure.
        stack:
          type: string
          description: >
            Optional diagnostic copy of the server-side JavaScript call stack.
            Present only on error envelopes (e.g. `Err:FETCH_FAILED`, when the
            backend wraps a network/anupstream exception) to help debug
            connectivity failures from the browser. Not present on success.

    Subscription:
      description: Full subscription (with raw content)
      type: object
      required: [id, name, url, content, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Subscription file name
        url:
          type: string
          description: Subscription update URL (may be an empty string)
        content:
          type: string
          description: Raw subscription content, not processed in any way for now
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubscriptionSummary:
      description: Subscription summary (for listings, without content)
      type: object
      required: [id, name, url, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        url:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SubscriptionInput:
      description: |
        Request body for creating / updating a subscription.
        Validation rules: at least one of url and content must be provided (non-empty).
      type: object
      properties:
        name:
          type: string
          description: Subscription file name (optional; when omitted and a url is provided, derived from the last path segment of the url)
        url:
          type: string
          format: uri
          description: Subscription update URL (optional)
        content:
          type: string
          description: Raw subscription content (optional; stored directly only when no url is provided)
      anyOf:
        - required: [url]
        - required: [content]

    # NodeProxy was removed together with the "all nodes" build feature; node
    # shapes are now a purely client-side concern (see chiaotu SPA).

    RuleFilter:
      description: |
        The filter spec of a node-filtering rule. All dimensions are optional and
        independent: a present dimension filters (AND across dimensions), an
        empty dimension does not filter, and within a dimension the values are
        OR-ed. The shape is guaranteed by the frontend zod; the backend only
        guards against junk.
      type: object
      properties:
        subIds:
          type: array
          description: Subscription ids (as strings) to include; empty/absent = all subscriptions
          items:
            type: string
        nameKeywords:
          type: array
          description: Node names must contain at least one keyword (case-insensitive substring, OR)
          items:
            type: string
        typeMatch:
          type: array
          description: Node types must equal one of the values (OR)
          items:
            type: string
      example:
        subIds: ["1", "3"]
        nameKeywords: ["香港", "美国", "US", "HK"]
        typeMatch: ["vless", "hysteria2"]

    Rule:
      description: A persisted node-filtering rule (filter is the parsed filter object)
      type: object
      required: [id, name, filter, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Rule name (unique among active rules)
        filter:
          $ref: "#/components/schemas/RuleFilter"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deleted_at:
          type: string
          format: date-time
          nullable: true
          description: Soft-delete tombstone; NULL = active. Deleted rules are excluded from all reads.

    RuleInput:
      description: |
        Request body for creating / updating a rule. name is required (non-empty,
        unique); filter is optional and defaults to {} (matches every node).
      type: object
      required: [name]
      properties:
        name:
          type: string
          description: Rule name (required, non-empty, unique)
        filter:
          $ref: "#/components/schemas/RuleFilter"

    HostsEntry:
      type: object
      required: [id, profile_id, domain, ip, enabled, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        profile_id: { type: integer, format: int64 }
        domain: { type: string }
        ip: { type: string, description: Empty means fallback is resolved during generation }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
    HostsProfile:
      type: object
      required: [id, name, entries, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        entries:
          type: array
          items: { $ref: "#/components/schemas/HostsEntry" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }
    HostsProfileInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
    HostsEntryInput:
      type: object
      required: [domain, ip, enabled]
      properties:
        domain: { type: string }
        ip: { type: string, description: Empty or valid IPv4; IPv6 reserved for future use }
        enabled: { type: boolean }
    HostsImportInput:
      type: object
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 50
          items:
            type: object
            required: [domain, ip]
            properties:
              domain: { type: string }
              ip: { type: string }
    RuleSetItem:
      description: |
        One matcher inside a rule set. `type` + `payload` render verbatim as a
        `TYPE,PAYLOAD` line of the classical rule-provider payload; `enabled`
        false keeps the row but omits the line.
      type: object
      required: [id, rule_set_id, type, payload, enabled, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        rule_set_id: { type: integer, format: int64 }
        type:
          type: string
          enum: [DOMAIN, DOMAIN-SUFFIX, DOMAIN-KEYWORD, DOMAIN-WILDCARD, IP-CIDR]
        payload:
          type: string
          description: |
            The matcher body, normalized on write: domains are lower-cased with
            the trailing dot stripped, and a bare IP gets its /32 (IPv4) or /128
            (IPv6) prefix appended. Commas / whitespace are rejected because they
            would break the line format.
        enabled: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }

    RuleSet:
      description: |
        A named collection of routing matchers distributed as its own mihomo
        `classical` rule-provider payload. `slug` is the public capability used
        by GET /api/rulesets/payload/{slug}; `key` is the deterministic YAML key the
        generated config declares under `rule-providers` (derived from the id, so
        it can never collide with the base template's own provider names).
      type: object
      required: [id, name, slug, key, policy, items, created_at, updated_at]
      properties:
        id: { type: integer, format: int64 }
        name:
          type: string
          description: |
            Display name (unique among active rule sets). With the GROUP policy it
            also names the generated proxy group, so commas and control
            characters are rejected on write.
        slug:
          type: string
          description: Public capability for the unauthenticated download link
        key:
          type: string
          description: "YAML key under rule-providers; `chiaotu_rs_<id>`"
        policy:
          type: string
          enum: [DIRECT, REJECT, GROUP]
          description: |
            Symbolic RULE-SET target, resolved at generation time: DIRECT /
            REJECT map to the built-ins, and GROUP makes the generated config
            declare a dedicated select group named "\U0001F4E6 <name>" holding
            DIRECT, the "\U0001F310 手动选择" group and every projected node, with
            the RULE-SET line pointing at it.
        items:
          type: array
          items: { $ref: "#/components/schemas/RuleSetItem" }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }

    RuleSetInput:
      description: |
        Request body for creating / updating a rule set. The slug is assigned by
        the backend and is not accepted here.
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          description: |
            No comma or control character: with the GROUP policy the name is
            emitted inside a comma-separated `RULE-SET,<key>,<target>` line.
        policy:
          type: string
          enum: [DIRECT, REJECT, GROUP]
          default: GROUP

    RuleSetItemInput:
      description: Only the enabled flag is mutable; type / payload are the item's identity.
      type: object
      required: [enabled]
      properties:
        enabled: { type: boolean }

    RuleSetImportInput:
      type: object
      required: [items]
      properties:
        items:
          type: array
          maxItems: 50
          items:
            type: object
            required: [type, payload]
            properties:
              type:
                type: string
                enum: [DOMAIN, DOMAIN-SUFFIX, DOMAIN-KEYWORD, DOMAIN-WILDCARD, IP-CIDR]
              payload: { type: string, minLength: 1 }

    InitialDump:
      description: |
        Complete application state returned by GET /api/initial-dump: all active
        subscriptions (full content), all rules (newest first), all Hosts
        profiles and all rule sets (each with their active children). The
        frontend calls this once on entry and hydrates its store from the single
        response; the backend never parses YAML, node parsing stays in the
        browser.
      type: object
      required: [subscriptions, rules, hostsProfiles, ruleSets]
      properties:
        hostsProfiles:
          type: array
          items: { $ref: "#/components/schemas/HostsProfile" }
        ruleSets:
          type: array
          items: { $ref: "#/components/schemas/RuleSet" }
        subscriptions:
          type: array
          items: { $ref: "#/components/schemas/Subscription" }
        rules:
          type: array
          items: { $ref: "#/components/schemas/Rule" }

    Generated:
      description: |
        A generated result file: the full clash YAML config produced by the
        frontend in the browser and uploaded to the backend. name is the public
        download token; display_name is optional and may be duplicated.
      type: object
      required: [id, name, content, created_at, updated_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Public download token chosen by the frontend
        display_name:
          type: string
          nullable: true
          description: Optional user-facing name; duplicate values are allowed
        content:
          type: string
          description: The produced clash YAML config, stored as-is
        created_at:
          type: string
          format: date-time
          description: Generation time
        updated_at:
          type: string
          format: date-time

    GeneratedPage:
      description: |
        A page of generated results. items are ordered by updated_at descending
        (newest modified first); page is 1-based. total_pages is 0 when there
        are no results.
      type: object
      required: [items, page, page_size, total, total_pages]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Generated" }
        page:
          type: integer
          description: Current 1-based page number
        page_size:
          type: integer
          description: Number of items per page
        total:
          type: integer
          description: Total number of active generated results
        total_pages:
          type: integer
          description: Total number of pages (0 when empty)

    GeneratedInput:
      description: |
        Request body for storing a generated result. display_name is optional;
        name and content must be non-empty.
      type: object
      required: [name, content]
      properties:
        name:
          type: string
          description: Public download token chosen by the frontend (non-empty)
        display_name:
          type: string
          nullable: true
          description: Optional user-facing name; duplicate values are allowed
        content:
          type: string
          description: The produced clash YAML config (non-empty)

    GeneratedUpdate:
      description: Partial update for an active generated result. At least one field must be provided.
      type: object
      properties:
        display_name:
          type: string
          nullable: true
          description: User-facing name; null clears it
        content:
          type: string
          description: The produced clash YAML config (non-empty)
      minProperties: 1


